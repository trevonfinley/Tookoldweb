<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Create Account | Project Neo | DJ Too Kold</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body" data-auth-page="signup">
  <header class="admin-header">
    <a class="brand" href="index.html" aria-label="DJ Too Kold home">
      <span class="brand-mark" aria-hidden="true"><img src="assets/images/dj-too-kold-logo.jpeg" alt="" width="48" height="48"></span>
      <span>DJ Too Kold</span>
    </a>
    <span class="admin-product-name">Project Neo</span>
  </header>

  <main class="admin-auth-main">
    <section class="admin-auth-panel" aria-labelledby="auth-signup-title">
      <p class="eyebrow">Account access</p>
      <h1 id="auth-signup-title">Create Account</h1>

      <form class="admin-login-form" data-auth-signup-form method="post" novalidate>
        <div class="form-group">
          <label for="signup-name">Full name</label>
          <input id="signup-name" name="fullName" type="text" autocomplete="name">
        </div>
        <div class="form-group">
          <label for="signup-email">Email</label>
          <input id="signup-email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <button class="btn-primary" type="submit">Create Account</button>
        <p class="admin-status" data-auth-status aria-live="polite"></p>
      </form>

      <div class="auth-divider" aria-hidden="true"><span>or</span></div>

      <div class="auth-action-grid">
        <button class="btn-secondary auth-provider-button" type="button" data-oauth-provider="google">Continue with Google</button>
        <button class="btn-secondary auth-provider-button" type="button" data-oauth-provider="apple">Continue with Apple ID</button>
      </div>

      <nav class="auth-link-row" aria-label="Account access links">
        <a href="admin-login.html">Sign In</a>
        <a href="auth-forgot-password.html">Forgot Password</a>
      </nav>
    </section>
  </main>

  <script src="project-neo-config.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="auth-client.js" defer></script>
  <script src="auth-pages.js" defer></script>
</body>
</html>
