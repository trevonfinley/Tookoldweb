<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Signing In | Project Neo | DJ Too Kold</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body" data-auth-page="callback">
  <header class="admin-header">
    <a class="brand" href="index.html" aria-label="DJ Too Kold home">
      <span class="brand-mark" aria-hidden="true"><img src="assets/images/dj-too-kold-logo.jpeg" alt="" width="48" height="48"></span>
      <span>DJ Too Kold</span>
    </a>
    <span class="admin-product-name">Project Neo</span>
  </header>

  <main class="admin-auth-main">
    <section class="admin-auth-panel" aria-labelledby="auth-callback-title">
      <p class="eyebrow">Account access</p>
      <h1 id="auth-callback-title">Signing In</h1>
      <p class="admin-status" data-auth-status aria-live="polite">Completing sign-in...</p>
    </section>
  </main>

  <script src="project-neo-config.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="auth-client.js" defer></script>
  <script src="auth-pages.js" defer></script>
</body>
</html>
