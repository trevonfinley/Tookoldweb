<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Reset Password | Project Neo | DJ Too Kold</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body" data-auth-page="forgot-password">
  <header class="admin-header">
    <a class="brand" href="index.html" aria-label="DJ Too Kold home">
      <span class="brand-mark" aria-hidden="true"><img src="assets/images/dj-too-kold-logo.jpeg" alt="" width="48" height="48"></span>
      <span>DJ Too Kold</span>
    </a>
    <span class="admin-product-name">Project Neo</span>
  </header>

  <main class="admin-auth-main">
    <section class="admin-auth-panel" aria-labelledby="auth-forgot-title">
      <p class="eyebrow">Account access</p>
      <h1 id="auth-forgot-title">Reset Password</h1>

      <form class="admin-login-form" data-auth-forgot-form novalidate>
        <div class="form-group">
          <label for="forgot-email">Email</label>
          <input id="forgot-email" name="email" type="email" autocomplete="email" required>
        </div>
        <button class="btn-primary" type="submit">Send Reset Link</button>
        <p class="admin-status" data-auth-status aria-live="polite"></p>
      </form>

      <nav class="auth-link-row" aria-label="Account access links">
        <a href="admin-login.html">Sign In</a>
        <a href="auth-signup.html">Create Account</a>
      </nav>
    </section>
  </main>

  <script src="project-neo-config.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="auth-client.js" defer></script>
  <script src="auth-pages.js" defer></script>
  <script src="speed-insights.js" defer></script>
</body>
</html>
